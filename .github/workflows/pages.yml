name: Publish Miao Albums database

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -R assets data images _site/
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/data/records.js
          test -s _site/data/imported_ocr.js
          test -s _site/images/001.webp
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Allow uploaded artifact to become available
        run: sleep 10
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
