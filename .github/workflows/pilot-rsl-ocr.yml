name: Run Russian Miao OCR pilot
on:
  push:
    paths:
      - '.github/workflows/pilot-rsl-ocr.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-script-hant
          python -m pip install -q requests pillow
      - name: Probe public-domain PDF page scans and run provisional OCR
        run: python scripts/pilot_rsl_ocr.py
      - name: Save source-image samples and raw OCR for review
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rsl_machine_pilot.json images/external_pilot/rsl_*
          git diff --cached --quiet || (git commit -m 'Store unverified RSL pilot scan OCR' && git push)
