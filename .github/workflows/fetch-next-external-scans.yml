name: Fetch next RSL and Manchester manuscript scans
on:
  push:
    paths:
      - '.github/workflows/fetch-next-external-scans.yml'
      - 'scripts/fetch_next_external_scans.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q requests pillow
      - name: Fetch source page images and create provisional crops
        run: python scripts/fetch_next_external_scans.py
      - name: Save public-domain scan samples and review previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/external_source_pilot_inventory.json
          git add images/external_pilot/rsl_v1_p* images/external_pilot/rsl_v2_p* images/external_pilot/manchester_p0*.jpg
          if ! git diff --cached --quiet; then
            git commit -m 'Save source image previews for next bilingual manuscript review batch'
            for i in 1 2 3 4; do
              git pull --rebase origin main
              git push origin HEAD:main && exit 0
              sleep 4
            done
            exit 1
          fi
