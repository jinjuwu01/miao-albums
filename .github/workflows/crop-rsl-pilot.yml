name: Crop RSL verified caption spreads
on:
  push:
    paths:
      - '.github/workflows/crop-rsl-pilot.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  crop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -q pillow
      - name: Split manuscript scans into separate illustration and caption images
        run: python scripts/crop_rsl_pilot.py
      - name: Commit indexed crops
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/external_pilot/rsl_v1_p0*_*jpg
          if ! git diff --cached --quiet; then
            git commit -m 'Save separately cropped Russian paintings and inscriptions'
            for i in 1 2 3 4; do
              git pull --rebase origin main
              git push origin HEAD:main && exit 0
              sleep 4
            done
            exit 1
          fi
