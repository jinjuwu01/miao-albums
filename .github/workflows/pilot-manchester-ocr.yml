name: Run Manchester Miao OCR pilot
on:
  push:
    paths:
      - '.github/workflows/pilot-manchester-ocr.yml'
      - 'scripts/pilot_external_ocr.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install OCR dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-chi-tra tesseract-ocr-script-hant
          python -m pip install -q requests pillow
      - name: Read sample IIIF scans and run OCR
        run: python scripts/pilot_external_ocr.py
      - name: Commit provisional OCR samples and browseable source thumbnails
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rsl_manchester_machine_pilot.json images/external_pilot
          git diff --cached --quiet || (git commit -m 'Save unverified Manchester OCR quality pilot' && git push)
